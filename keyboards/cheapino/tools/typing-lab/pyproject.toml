[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheapino-typing-lab"
version = "0.1.0"
description = "Host-side acquisition tools for Cheapino firmware typing telemetry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hid = ["hidapi>=0.14"]

[project.scripts]
cheapino-typing-lab = "cheapino_typing_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
